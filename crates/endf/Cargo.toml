[package]
name = "endf"
description = "Parser for ENDF-6 formatted evaluated nuclear data files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["endf", "nuclear", "ace", "physics", "parser"]
categories = ["science", "parser-implementations"]
# The parity harness stays in the repository. Its golden dumps are 900 KB and
# the evaluations they name live in `tests/` at the repository root, outside
# this crate, so a published package would carry the dumps without the files
# they refer to and the tests could not run from it anyway.
exclude = ["tests/"]

# Deliberately dependency-free. This crate is the format layer: consumers that
# need Arrow, Python bindings or a simulation-ready projection build those on
# top rather than paying for them here.
[dependencies]

# Tests only, and so not a dependency of anything that uses this crate. The
# fixtures and the golden dumps are stored xz-compressed — an evaluation is
# highly repetitive and compresses about six to one — and this reads them.
# Pure Rust, so there is no C toolchain to have.
[dev-dependencies]
lzma-rs = "0.3"
